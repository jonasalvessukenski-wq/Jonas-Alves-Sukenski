<!doctype html>
<html><head><meta charset="utf-8"><title>placa de vidro → PNG</title><style>
html,body{margin:0;background:transparent}
#wrap{position:relative;width:540px;height:540px}
/* a mesma placa de vidro dos títulos de área (pranchas P6/P8): pintada uma vez e usada como imagem,
   porque o Chromium em software pintava blocos brancos dentro dela quando desenhada por CSS a cada quadro */
.tile{position:absolute;left:120px;top:120px;width:300px;height:300px;border-radius:56px;background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.07));border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.15),0 40px 90px rgba(0,30,100,.35)}
</style></head><body><div id="wrap"><div class="tile"></div></div></body></html>
